<style id='soft-tiles-theme'>
/* ============================================================================
   Soft-tile theme: the adopted HMI style (LVGL port pending).
   Rules:
   - Three depth levels: page < panel < tile. Interactive items are tiles,
     i.e. lighter than whatever they sit on. Value fields are recessed wells.
   - Every button carries a 2px gradient edge on the side facing away from
     where it sits on screen (bottom bar -> top edge, left rail -> right
     edge, top toolbar -> bottom edge, right-hand controls -> left edge).
   - Selected items get a brighter face and a full-strength edge.
   - Important actions (primary, pause, delete/stop) also colour their text.
   Everything below is scoped to #soft so it overrides the base layer without
   editing it.
   ========================================================================== */
#soft{
 --page:#111416;--panel:#1a1f22;
 --tile-hi:#2c3338;--tile-lo:#252b2f;
 --tile-hi-hover:#323a40;--tile-lo-hover:#2b3237;
 --tile-hi-on:var(--tile-hi);--tile-lo-on:var(--tile-lo);
 --well:#0e1113;
 --hairline:rgba(255,255,255,.055);--hairline-strong:rgba(255,255,255,.09);
 --text:#f1f3f2;--muted:#aeb7bb;--dim:#7f8a90;
 --amber:#e8a04b;--amber-text:#f3b665;--amber-soft:rgba(232,160,75,.5);--amber-glow:rgba(232,160,75,.2);
 --yellow:#f2c94c;--yellow-text:#f7d774;--red:#e0786b;--red-text:#ffb3a7;--red-glow:rgba(224,120,107,.13);
 --heat:#e8a04b;--hold:#a77bd1;--cool:#42b6a3;--ok:#8fcfa9;
 --neutral-edge:rgba(255,255,255,.2);--amber-quiet:rgba(232,160,75,.3);
 --radius:10px;--radius-lg:12px;
 --lift:inset 0 1px 0 rgba(255,255,255,.05),0 2px 6px rgba(0,0,0,.28);
}
#soft body,#soft .demo-shell,#soft .demo-shell:fullscreen,#soft .demo-shell.is-fallback-fullscreen{background:#0c0e10}
#soft .screen{background:var(--page);border-radius:14px;box-shadow:0 0 0 1px rgba(255,255,255,.04),0 18px 40px rgba(0,0,0,.45)}

/* ---- Tiles: every button inside the HMI and the message dialog ---------- */
#soft .screen button,#soft dialog button,#soft .screen div.stage-card{
 --edge:var(--amber-soft);--glow:transparent;--glow-reach:55%;
 --edge-at:center bottom;--edge-w:100%;--edge-h:2px;--edge-dir:90deg;--glow-dir:0deg;
 --face-hi:var(--tile-hi);--face-lo:var(--tile-lo);
 color:var(--text);border:1px solid var(--hairline);border-radius:var(--radius);
 background:
  linear-gradient(var(--edge-dir),transparent 0%,var(--edge) 28%,var(--edge) 72%,transparent 100%) var(--edge-at)/var(--edge-w) var(--edge-h) no-repeat,
  linear-gradient(var(--glow-dir),var(--glow),transparent var(--glow-reach)) no-repeat,
  linear-gradient(180deg,var(--face-hi),var(--face-lo)) no-repeat;
 background-origin:border-box;
 box-shadow:var(--lift);opacity:1;
 transition:filter .12s ease,transform .06s ease;
}
#soft .screen button:hover:not(:disabled),#soft dialog button:hover:not(:disabled){filter:brightness(1.07)}
#soft .screen button:active:not(:disabled),#soft dialog button:active:not(:disabled){transform:translateY(1px);filter:brightness(1.12)}
#soft .screen button:disabled,#soft dialog button:disabled{--edge:transparent;--glow:transparent;--face-hi:#1f2427;--face-lo:#1d2124;color:var(--dim);box-shadow:none;opacity:1}
#soft button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#soft .screen button.top-light,#soft .screen button.top-light:hover:not(:disabled),#soft .screen button.top-light:active:not(:disabled){background:transparent;border:0;border-radius:0;box-shadow:none;transform:none;filter:none}

/* Edge placement: opposite the side of the screen the button sits on. */
#soft .nav button,#soft .actions button,#soft .edit-actions button,#soft .program-actions:not(.program-quarters) button,
#soft .run-controls button,#soft .manual-actions button,#soft .manual-control button,
#soft .program-editor-actions button,#soft .device-footer button,#soft dialog button,
#soft .keyboard-layout button{--edge-at:center top;--glow-dir:180deg}
#soft .rail button,#soft .quick-launch button{--edge-w:0px;--edge-h:0px;--ring-dir:to left;--glow-dir:270deg}
#soft .edit-field button,#soft .screen .device-row,#soft .content .row .value{--edge-w:0px;--edge-h:0px;--ring-dir:to right;--glow-dir:90deg}

/* Selected / active: brighter face, full-strength edge. */
#soft .rail button.active,#soft .nav button.selected,#soft .device-toolbar .chosen,
#soft .selectors button.selected,#soft .keyboard-row .shift-on{
 --face-hi:var(--tile-hi-on);--face-lo:var(--tile-lo-on);--edge:var(--amber);--glow:var(--amber-glow);--glow-reach:85%;color:var(--text);font-weight:600}

/* Important actions: only their text is coloured, so they never read as selected. */
#soft .screen button.primary,#soft dialog button.primary,#soft .screen .pause-action,#soft .screen .program-favourite{
 --edge:var(--amber);color:var(--amber-text)!important;font-weight:600}
#soft .screen button.danger,#soft dialog button.danger,#soft .program-toolbar .delete-action{
 --edge:var(--red);color:var(--red-text)!important;font-weight:600}
#soft .screen button.cancel-action,#soft dialog button.cancel-action{--edge:var(--red);color:var(--red-text)!important;font-weight:600}
#soft .screen button.edit-action{--edge:var(--yellow);color:var(--yellow-text)!important;font-weight:600}
#soft .screen button.primary:disabled,#soft .screen button.danger:disabled,#soft dialog button.danger:disabled,#soft .screen button.edit-action:disabled,#soft .screen button.cancel-action:disabled{color:var(--dim)!important;--edge:transparent;--glow:transparent}
/* The old outlined "stage action" buttons become ordinary tiles. */
#soft .stage-action{border:1px solid var(--hairline)!important;color:var(--text)!important;background:
  linear-gradient(90deg,transparent 0%,var(--amber-soft) 28%,var(--amber-soft) 72%,transparent 100%) center top/100% 2px no-repeat,
  linear-gradient(180deg,var(--tile-hi),var(--tile-lo))!important}
#soft .stage-action:hover{background:
  linear-gradient(90deg,transparent 0%,var(--amber-soft) 28%,var(--amber-soft) 72%,transparent 100%) center top/100% 2px no-repeat,
  linear-gradient(180deg,var(--tile-hi-hover),var(--tile-lo-hover))!important}

/* ---- Panels and information tiles --------------------------------------- */
#soft .program-graph,#soft .furnace-panel,#soft .quick-launch,#soft .manual-controls,#soft #touch-keyboard{
 background:var(--panel);border:1px solid var(--hairline);border-radius:var(--radius-lg);box-shadow:none}
#soft .row,#soft .metric,#soft .home-readings,#soft .program-facts,#soft .device-empty,#soft .device-log-row,
#soft .program-editor-name,#soft .program-stage-row,#soft .cooling-summary div,#soft .edit-field{
 background:linear-gradient(180deg,var(--tile-hi),var(--tile-lo));border:1px solid var(--hairline);border-radius:var(--radius-lg);box-shadow:var(--lift)}
#soft .program-editor-name{background:var(--panel);box-shadow:none}
#soft .edit-field button{--face-hi:#394249;--face-lo:#313940}
#soft .metric{padding:12px 12px 10px}
#soft .home-readings{padding:14px 16px}
#soft .program-fact.material,#soft .program-duration{border-top-color:var(--hairline-strong)}
#soft .program-summary{border-top-color:var(--hairline-strong)}
#soft .program-summary span+span{border-left-color:var(--hairline-strong)}
#soft .subtitle,#soft .row small,#soft .metric span,#soft .metric small,#soft .home-readings small,#soft .furnace-status small,
#soft .program-fact span,#soft .program-graph-label,#soft .device-row small,#soft .validity,#soft .device-footer span,
#soft .actions .status,#soft .run-reading small,#soft .manual-control span,#soft .edit-field label,#soft .page-label{color:var(--muted)}

/* ---- Bottom navigation: separate tiles, top edge ------------------------ */
#soft .nav{background:transparent;gap:8px;overflow:visible;border-radius:0}
#soft .nav button{border-radius:var(--radius);color:var(--muted);--edge:var(--amber-quiet)}
#soft .nav button.selected{color:var(--text);box-shadow:var(--lift)}

/* ---- Left rail (Device, Settings) --------------------------------------- */
#soft .rail{gap:6px}
#soft .rail button{--edge:var(--amber-quiet);color:var(--muted);min-height:50px;padding-left:14px}
#soft .rail button.active{color:var(--text)}

/* ---- Settings rows: the row is the tile; its value is the touch target --- */
#soft .content .row .value{--face-hi:transparent;--face-lo:transparent;box-shadow:none;border-color:transparent;border-radius:8px;min-height:40px;padding:4px 12px}
#soft .content .row:has(.value:is(button)){--edge:var(--amber-soft);--ring-dir:to right}
#soft .content .row .value:is(button){--edge:transparent}

/* ---- Device rows: status-coloured left edge ----------------------------- */
#soft .screen .device-row{border-radius:var(--radius-lg);--edge:var(--neutral-edge)}
#soft .device-row:has(.tone-due){--edge:var(--amber)}
#soft .device-row:has(.tone-fault){--edge:var(--red)}
#soft .device-row:has(.tone-ok){--edge:var(--ok)}
#soft .tone-ok{color:var(--ok)}

/* ---- Programs ------------------------------------------------------------ */
#soft .screen .program-card{border-radius:var(--radius-lg);padding:12px 14px}
#soft button.stage-card,#soft div.stage-card{border-radius:var(--radius-lg)}
#soft .screen .stage-card:has(.stage-heating){--edge:var(--heat)}
#soft .screen .stage-card:has(.stage-hold){--edge:var(--hold)}
#soft .screen .stage-card:has(.stage-cooling){--edge:var(--cool)}
#soft .stage-number{border-radius:6px;border-width:1px}
#soft .program-toolbar .icon-action{font-size:22px}

/* Stage type selector: selected type uses its own colour. */
#soft .stage-types button{--edge:var(--neutral-edge);color:var(--muted)}
#soft .stage-types button.selected{--face-hi:var(--tile-hi-on);--face-lo:var(--tile-lo-on);--glow-reach:85%;font-weight:600}
#soft .stage-types .stage-type-heating.selected{--edge:var(--heat);--glow:rgba(232,160,75,.16);color:var(--heat)}
#soft .stage-types .stage-type-hold.selected{--edge:var(--hold);--glow:rgba(167,123,209,.16);color:#c7a4ec}
#soft .stage-types .stage-type-cooling.selected{--edge:var(--cool);--glow:rgba(66,182,163,.16);color:#7fd8c9}

/* ---- Value fields are recessed wells ------------------------------------ */
#soft .edit-field input,#soft .edit-field select,#soft .keyboard-input,#soft dialog input{
 background:
  linear-gradient(90deg,transparent 0%,var(--field-edge,var(--amber-soft)) 28%,var(--field-edge,var(--amber-soft)) 72%,transparent 100%) center bottom/100% 2px no-repeat,
  var(--well);
 border:1px solid var(--hairline);border-radius:8px;color:var(--text);box-shadow:inset 0 2px 4px rgba(0,0,0,.35)}
#soft .keyboard-input{background:
  linear-gradient(90deg,transparent 0%,var(--amber) 28%,var(--amber) 72%,transparent 100%) center bottom/100% 2px no-repeat,var(--well)}
#soft .manual-control .manual-value,#soft .screen .program-name-field,#soft .program-editor-name button{
 --face-hi:var(--well);--face-lo:var(--well);--edge:var(--amber-soft);--edge-at:center bottom;--glow:transparent;
 box-shadow:inset 0 2px 4px rgba(0,0,0,.35)}

/* ---- Running ------------------------------------------------------------- */
#soft .run-controls .selectors{gap:6px}
#soft .selectors button{--edge:var(--amber-quiet);color:var(--muted);border-radius:var(--radius)}
#soft .selectors button.selected{box-shadow:var(--lift)}
#soft .run-readings.run-line{background:linear-gradient(180deg,var(--tile-hi),var(--tile-lo));border:1px solid var(--hairline);border-radius:var(--radius-lg);padding:4px 14px;box-shadow:var(--lift)}
#soft .run-readings.run-line>span{background:transparent}
#soft .run-title span{color:var(--amber-text)}

/* ---- Keyboard ------------------------------------------------------------ */
#soft #touch-keyboard{box-shadow:0 -6px 30px rgba(0,0,0,.55)}
#soft #touch-keyboard.numeric-keypad{box-shadow:0 0 0 2000px rgba(0,0,0,.7)}
#soft .keyboard-layout button{--edge:transparent;border-radius:9px}
#soft .keyboard-layout .function-key,#soft .keyboard-bottom button:not(.space-key):not(.primary),#soft .keyboard-number-actions button:not(.primary){--edge:var(--neutral-edge);color:var(--muted)}
#soft .keyboard-layout button.primary{--edge:var(--amber)}
#soft .keyboard-layout .shift-on{--edge:var(--amber);--glow:var(--amber-glow);--face-hi:var(--tile-hi-on);--face-lo:var(--tile-lo-on);color:var(--amber-text)}
#soft .keyboard-input::selection{background:rgba(232,160,75,.35);color:var(--text)}

/* ---- Dialog -------------------------------------------------------------- */
#soft dialog{background:
  linear-gradient(90deg,transparent 0%,var(--amber) 28%,var(--amber) 72%,transparent 100%) center top/100% 2px no-repeat,
  linear-gradient(180deg,#262d31,#1f2427);
 border:1px solid var(--hairline-strong);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
#soft dialog:has(footer .danger){background:
  linear-gradient(90deg,transparent 0%,var(--red) 28%,var(--red) 72%,transparent 100%) center top/100% 2px no-repeat,
  linear-gradient(180deg,#262d31,#1f2427)}
#soft dialog::backdrop{background:rgba(0,0,0,.66)}
/* ---- Program details: title row, action row, then graph + facts --------- */
#soft .program-quarters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
#soft .program-detail-columns.program-quarters>:first-child{grid-column:span 3}
#soft .program-actions.program-quarters{height:48px;min-height:48px}
#soft .program-actions.program-quarters button{min-width:0;padding:8px 10px;white-space:nowrap}
#soft .program-facts{padding:12px 14px}
#soft .program-fact-row .program-fact strong{font-size:24px}

/* ---- Top strip: same fading edge; light-on spills a warm glow downwards -- */
#soft button.top-light::before{height:3px;background:linear-gradient(90deg,transparent 0%,var(--amber) 28%,var(--amber) 72%,transparent 100%);box-shadow:none;transition:background .3s}
#soft button.top-light.light-on::before{background:linear-gradient(90deg,transparent 0%,#f6c453 22%,#ffe39a 50%,#f6c453 78%,transparent 100%);box-shadow:0 0 5px rgba(246,196,83,.35)}
#soft button.top-light::after{content:"";position:absolute;left:0;right:0;top:0;height:22px;pointer-events:none;
 background:radial-gradient(ellipse 50% 100% at 50% 0%,rgba(246,196,83,.24),rgba(246,196,83,.08) 55%,transparent 100%);
 mix-blend-mode:screen;opacity:0;transition:opacity .4s ease}
#soft button.top-light.light-on::after{opacity:1}

/* ---- Dialog buttons: equal width, centred ------------------------------- */

const setupAdvancedScenarioMenu=()=>{
 const outside=document.querySelector('.outside');if(!outside||outside.dataset.structured)return;
 const textKeyboard=$('try-text-keyboard'),numberKeyboard=$('try-number-keyboard'),startRun=$('demo-example'),manualAdvance=$('demo-advance');

 const notes=outside.querySelectorAll('p')[2];if(!textKeyboard||!numberKeyboard||!startRun||!manualAdvance||!programFixture||!deviceFixture||!connectionFixture||!size||!restartAssessment||!restartResult||!notes)return;
 const field=(label,control)=>{const wrapper=node('label',undefined,'scenario-field');wrapper.htmlFor=control.id;wrapper.append(node('span',label),control);return wrapper;};
 const group=(title,content)=>{const section=node('section',undefined,'scenario-group'),heading=node('h3',title);section.append(heading,content);return section;};
 const actions=node('div',undefined,'scenario-buttons');actions.append(textKeyboard,numberKeyboard,startRun,manualAdvance);
 const data=node('div',undefined,'scenario-fields');data.append(field('Program library',programFixture),field('Device data',deviceFixture),field('Connection fixture',connectionFixture));
 const review=node('div',undefined,'scenario-fields');review.append(field('Concept viewport',size),field('Restart assessment',restartAssessment),field('Restart attempt result',restartResult));
 const groups=node('div',undefined,'scenario-groups');groups.append(group('Actions',actions),group('Data fixtures',data),group('Review and recovery',review));
 const intro=node('div',undefined,'scenario-intro');intro.append(node('strong','Advanced demo scenarios'),node('p','These controls are grouped by purpose and stay outside the faithful HMI rectangle. Program changes, fixtures and keyboard previews are local to this page.'));
 notes.className='scenario-note';outside.replaceChildren(intro,groups,notes);outside.dataset.structured='true';
};
setupAdvancedScenarioMenu();
const PROGRAM_MAX_TEMPERATURE_C=180,PROGRAM_MAX_RATE_TENTHS=30,PROGRAM_MAX_CURING_MINUTES=2880;
const initial={rate:3,temperature:200,duration:720,brightness:80,dim:5,motion:'Off',view:'Split',format:'24-hour'};
let mainPage='home',deviceTab='overview',deviceFilter='all',devicePage=0,selectedComponent=null;
let programEditor=null,programLoadOrigin='home',manualDraft={target:120,rate:2},manualRun=null,manualStatusNotice='';
const controller={session:1,pending:null,light:false,events:[],requestId:0,phase:'idle',limits:{maxTemperature:180,maxRate:3,maxCuringMinutes:2880}};
function controllerEvent(source,event,result='confirmed'){controller.events.unshift({time:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),source,event,result});controller.events=controller.events.slice(0,24);}
function controllerRequest(event,apply){const requestId=++controller.requestId;controller.pending=event;controllerEvent('HMI',event,'requested');render();window.setTimeout(()=>{if(requestId!==controller.requestId)return;controller.pending=null;apply();controllerEvent('Control CPU',event,'accepted');render();},180);}
function controllerLimits(){return controller.limits;}
let saved={...initial},candidate={...saved},tab='display',displayPage=0,editing=null;
const dirty=()=>Object.keys(saved).some(k=>saved[k]!==candidate[k]);
const duration=v=>`${Math.floor(v/60)} h ${String(v%60).padStart(2,'0')} min`;
function node(tag,text,className){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(className)n.className=className;return n;}
// Navigation moves (reversible, no side effects) share one edge colour; see the data-nav variant.
const NAV_LABELS=/^(Back|‹ Back|Previous|Next|More ›|Part info|View stages|Stay)$/;
// Icons come from the shared set in app/hmi/presentation/icons (embedded by tools/build_icon_sprite.py).
function icon(name){const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg'),use=document.createElementNS(ns,'use');svg.setAttribute('class','icon');svg.setAttribute('aria-hidden','true');use.setAttribute('href','#i-'+name);svg.append(use);return svg;}
// [icon, placement, label]. Labelled buttons keep their text; icon-only buttons get an accessible name (callers may override it).
const BUTTON_ICONS={'Back':['arrow-left'],'\u2039 Back':['arrow-left','start','Back'],'More \u203a':['chevron-right','end','More'],'Previous':['chevron-left'],'Next':['chevron-right','end'],
 'Edit program':['pencil'],'Edit stages':['pencil'],'Delete program':['trash'],'New program':['plus'],'View stages':['list'],'Part info':['info'],
 'Start program':['play'],'Start':['play'],'Start manual':['play'],'Resume':['play'],'Pause':['pause'],'Stop':['stop'],'Return Home':['home'],'Show cooling':['chart'],'Hide cooling':['chart'],'Graph':['chart'],'Split':['split'],'Furnace':['furnace'],
 'Caps':['shift'],'Delete':['backspace'],'\u2190':['arrow-left','only','Move cursor left'],'\u2192':['arrow-right','only','Move cursor right'],
 '\u270e':['pencil','only','Edit'],'\u2605':['star-filled','only','Favourite'],'\u2606':['star','only','Favourite'],'\u2039':['chevron-left','only','Previous'],'\u203a':['chevron-right','only','Next'],'+':['plus','only','Increase'],'-':['minus','only','Decrease']};
function applyButtonIcon(b,text){const spec=BUTTON_ICONS[text];if(!spec)return;const [name,place='start',label]=spec;if(place==='only'){b.replaceChildren(icon(name));b.classList.add('icon-only');if(label)b.setAttribute('aria-label',label);return;}const words=node('span',label??b.textContent);b.replaceChildren(...(place==='end'?[words,icon(name)]:[icon(name),words]));}
function button(text,fn,className){const b=node('button',text==='Backspace'?'Delete':text,className);if(NAV_LABELS.test(text))b.classList.add('nav-action');applyButtonIcon(b,text==='Backspace'?'Delete':text);b.type='button';b.onclick=fn;return b;}
function tell(title,text){$('message-title').textContent=title;$('message-text').textContent=text;$('message-actions').replaceChildren(button('Close',()=>$('message').close(),'primary'));$('message').showModal();}
function go(next){if(next===tab)return;if(dirty()){$('message-title').textContent='Unsaved preferences';$('message-text').textContent='Save your changes, discard them, or stay on this page.';$('message-actions').replaceChildren(button('Stay',()=>$('message').close()),button('Discard',()=>{candidate={...saved};$('message').close();tab=next;render();},'danger'),button('Save',()=>{saved={...candidate};$('message').close();tab=next;render();},'primary'));$('message').showModal();}else{tab=next;render();}}
function edit(key,title,help,min,max,step){openNumericKeyboard(title,candidate[key],{min,max,step,help},value=>{candidate[key]=value;render();});}

function row(rows,label,value,action,detail){const r=node('div',undefined,'row'),l=node('div',label,'label');if(detail)l.append(node('small',detail));r.append(l);r.append(action?button(value,action,'value'):node('span',value,'value'));rows.append(r);}
function render(){if(touchKeyboard)closeTouchKeyboard(false);if(mainPage!=='stage-edit')hideStageDialog();document.querySelector('.nav').style.display=(mainPage==='running'||mainPage==='manual-running'||mainPage==='stage-edit'||mainPage==='program-editor')?'none':'flex';if(programGraphObserver){programGraphObserver.disconnect();programGraphObserver=null;}if(mainPage==='home'){renderHome();return;}if(mainPage==='manual'||mainPage==='manual-running'){renderManual();return;}if(mainPage==='running'){renderRunning();return;}if(mainPage==='stage-edit'){renderStageEditor();return;}if(mainPage==='program-editor'){renderProgramEditor();return;}if(mainPage==='loading'){renderLoading();return;}if(mainPage==='programs'){renderPrograms();return;}if(mainPage==='device'){renderDevice();return;}mountShell('Settings',settingsCategories,tab,next=>go(next));document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});const c=$('content');c.replaceChildren();const titles={program:'Program preferences',display:'Display & interaction',time:'Date & time',connections:'Connections',maintenance:'Maintenance'};c.append(node('h2',titles[tab]));const subtitles={program:'Controller limits are supplied by the furnace.',display:'Adjust this display to suit your workspace.',time:'Date and time are supplied by the furnace controller.',connections:'Availability follows device configuration.',maintenance:'Maintenance workflows are presented here.'};c.append(node('p',subtitles[tab],'subtitle'));const rows=node('div',undefined,tab==='maintenance'?'rows maintenance':'rows');c.append(rows);
 if(tab==='program'){
  row(rows,'Maximum heating rate',`${candidate.rate.toFixed(1)} °C/min  ›`,()=>edit('rate','Maximum heating rate (°C/min)','Controller limits still apply.',0.1,PROGRAM_MAX_RATE_TENTHS/10,0.1));
  row(rows,'Maximum temperature',`${candidate.temperature} °C  ›`,()=>edit('temperature','Maximum temperature (°C)','A display preference, not a furnace protection limit.',1,PROGRAM_MAX_TEMPERATURE_C,1));
  row(rows,'Maximum program duration',`${duration(candidate.duration)}  ›`,()=>edit('duration','Maximum program duration (minutes)','Planned duration preference. Does not enforce an actual run cutoff. Concept entry range: 1–59999 minutes.',1,59999,1));
 }else if(tab==='display'){
  // Up to five rows per page; the remainder sits behind More.
  const displayRows=[
   ()=>row(rows,'Brightness',`${candidate.brightness}%  ›`,()=>edit('brightness','Brightness (%)','Screen brightness.',10,100,1)),
   ()=>row(rows,'Dim when idle',`${candidate.dim} min  ›`,()=>edit('dim','Idle dim delay (minutes)','Keeps the screen legible during operation and faults.',1,60,1)),
   ()=>row(rows,'Reduced motion',candidate.motion,()=>{candidate.motion=candidate.motion==='Off'?'On':'Off';render();}),
   ()=>row(rows,'Default Running view',`${candidate.view}  ›`,()=>{const modes=['Graph','Split','Furnace'];candidate.view=modes[(modes.indexOf(candidate.view)+1)%3];render();}),
   ()=>row(rows,'Language / units','English / °C',null,'Initially supported options'),
   ()=>row(rows,'Theme','Graphite',null,'Current visual theme')];
  displayRows.slice(displayPage*5,displayPage*5+5).forEach(draw=>draw());
 }else if(tab==='time'){
  row(rows,'Controller date','14 Sep 2026',()=>tell('Set date & time','Date and time are set on the controller.'),'Current value');
  row(rows,'Controller time',candidate.format==='24-hour'?'14:32':'2:32 PM',()=>tell('Set date & time','The controller confirms or rejects the change.'),'Current value');
  row(rows,'Display format',candidate.format,()=>{candidate.format=candidate.format==='24-hour'?'12-hour':'24-hour';render();});
 }else if(tab==='maintenance'){
  row(rows,'Reset settings','Review',resetScopes,'Choose which local preferences to reset');
  row(rows,'Delete programs','Review',deletePrograms,'Controller-owned program library');
  row(rows,'Restart display','Review',restartDisplay,'Restart this display only');
  row(rows,'Attempt furnace restart','Check',assessRestart,'Ask the controller before confirmation');
 }else{
  const mode=$('fixture').value,status={disabled:'Disabled by configuration',unsupported:'Not supported',unknown:'Checking availability',enabled:'Not connected'}[mode];
  for(const name of ['Server','Bluetooth'])row(rows,name,mode==='enabled'?'Set up  ›':status,mode==='enabled'?()=>tell(`${name} setup`,name==='Server'?'Connection details appear here when supported and enabled.':'Pairing details appear here only when supported and enabled. Radio hardware, permissions and pairing flow remain to be defined.'):null,mode==='enabled'?status:undefined);
  c.append(node('p','Server and Bluetooth status are separate from the furnace link.','subtitle'));
 }
