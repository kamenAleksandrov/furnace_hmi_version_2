# SIMULATION ONLY: the HMI's screens on a memory display, and its controller
# link on a host serial device, with a random client session ID at each boot
# (run with --seed-random).
CONFIG_ZTEST=y
CONFIG_STD_C17=y
# The test thread is the GUI context: LVGL draws on its stack.
CONFIG_ZTEST_STACK_SIZE=16384

# A memory display (boards/native_sim.overlay) instead of SDL, so no window is needed.
CONFIG_DISPLAY=y
CONFIG_SDL_DISPLAY=n

CONFIG_SERIAL=y
CONFIG_UART_NATIVE_TTY=y
# The link receives by interrupt into a ring (controller_link.c, M21-7b).
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_ENTROPY_GENERATOR=y
# The controller runs in real time; so must the HMI's clock (ztest builds default to free running).
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=y
