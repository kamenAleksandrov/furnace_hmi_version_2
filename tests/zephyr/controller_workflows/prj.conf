# SIMULATION ONLY: the controller link on a host serial device, and a random
# client session ID at each boot (run with --seed-random).
CONFIG_ZTEST=y
CONFIG_STD_C17=y
CONFIG_ZTEST_STACK_SIZE=8192
CONFIG_SERIAL=y
CONFIG_UART_NATIVE_TTY=y
CONFIG_ENTROPY_GENERATOR=y
# The controller runs in real time; so must the HMI's clock (ztest builds default to free running).
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=y
