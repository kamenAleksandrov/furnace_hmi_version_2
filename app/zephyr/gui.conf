# LVGL for the shared presentation: the features the desktop program enables in
# simulator/desktop/lv_conf.h, so both builds draw the same screens. Used by the
# application on boards with a display (CMakeLists.txt) and by
# tests/zephyr/presentation.

CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_32=y
# Below the 32-bit sys_heap limit (just under 256 KiB without
# CONFIG_SYS_HEAP_BIG_ONLY); the desktop program's pool is larger.
CONFIG_LV_Z_MEM_POOL_SIZE=196608
# native_sim runs threads on host stacks, so this size is not validated there.
CONFIG_MAIN_STACK_SIZE=8192

CONFIG_LOG=y
CONFIG_LV_USE_LOG=y

CONFIG_LV_USE_BUTTON=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_TEXTAREA=y
CONFIG_LV_USE_CHART=y
CONFIG_LV_GRADIENT_MAX_STOPS=5

CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_24=y
CONFIG_LV_FONT_MONTSERRAT_32=y
CONFIG_LV_FONT_MONTSERRAT_40=y
