# native_sim (64-bit, which links the host's SDL2): the SDL display and the SDL
# pointer, a window on the developer's desktop (WSLg in WSL).
CONFIG_DISPLAY=y
CONFIG_INPUT=y

# The controller link on a host serial device (the overlay), and a random client
# session ID at each boot (run with --seed-random: the default seed is fixed).
CONFIG_SERIAL=y
CONFIG_UART_NATIVE_TTY=y
CONFIG_ENTROPY_GENERATOR=y
